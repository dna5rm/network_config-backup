---
# junipernetworks.junos.junos: collect the configuration as set lines.
#
# The pager is turned off with the no-more pipe. Nothing is committed on the
# device and the configuration mode is never entered. A failed contact fails
# the host and writes no archive file.
- name: Turn the pager off and collect the running configuration
  junipernetworks.junos.junos_command:
    commands:
      - show configuration | display set | no-more
  register: config_backup_junos_show
  no_log: true

- name: Fail the contact when the running configuration is empty
  ansible.builtin.fail:
    msg: "{{ inventory_hostname }}: 'show configuration' returned no output."
  when: >-
    (config_backup_junos_show.stdout | default([], true) | length) < 1
    or (config_backup_junos_show.stdout[0] | default('', true) | trim | length) == 0

- name: Note the collected configuration
  ansible.builtin.set_fact:
    config_backup_raw_config: "{{ config_backup_junos_show.stdout[0] }}"

- name: Redact the sensitive lines of the running configuration
  ansible.builtin.set_fact:
    config_backup_redacted: "{{ config_backup_raw_config | junos_redact | trim }}\n"

- name: List the redaction rules that survived redaction
  ansible.builtin.set_fact:
    config_backup_leaked_rules: "{{ config_backup_redacted | junos_leaks }}"

- name: Fail closed rather than archive a leaking configuration
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: the redacted configuration still matches the
      sensitive rules {{ config_backup_leaked_rules | join(', ') }}. The raw
      configuration is not written to the archive.
  when: (config_backup_leaked_rules | length) > 0

- name: Write the redacted configuration to the archive working tree
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/_archive_write.yml"

- name: Note the archive path this device contributed
  ansible.builtin.set_fact:
    config_backup_written_path: "{{ nb_site_slug }}/{{ inventory_hostname }}.cfg"
