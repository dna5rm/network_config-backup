# ansible.cfg — network_config-backup.
#
# The default inventory is empty on purpose: real runs go through ./backup,
# which renders a temporary inventory from inventory/netbox.yml.example and
# passes it with -i. Offline tooling never contacts NetBox by accident.

[defaults]
inventory = inventory/empty.yml
host_key_checking = False
retry_files_enabled = False
gathering = explicit
forks = 10
stdout_callback = default
interpreter_python = auto_silent
deprecation_warnings = False
force_valid_group_names = silently
# Install with: ansible-galaxy collection install -r requirements.yml -p ./collections
collections_path = ./collections

[persistent_connection]
command_timeout = 120
connect_timeout = 30
# Password login: libssh offers agent keys first, which device logins reject.
ssh_type = paramiko

[paramiko_connection]
look_for_keys = False