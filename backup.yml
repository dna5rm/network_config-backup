---
# network_config-backup: nightly device configuration backup.
#
# Membership (decided by NetBox plus the gate below): status active, primary
# IPv4 set, and the platform custom field ansible_network_os holding a
# backed-up value. Devices that do not qualify are ended before anything
# connects to them.
#
# Environment: NETBOX_API, NETBOX_TOKEN, BACKUP_USER, BACKUP_PASSWORD.
# Optional: NETBOX_SITE, NETBOX_PLATFORM (inserted by ./backup),
# BACKUP_GIT_URL, BACKUP_GIT_TOKEN, BACKUP_WORKDIR.
#
# The play is read-only against NetBox: the inventory plugin returns
# devices and the platform-metadata lookup returns the two platform custom
# fields, and nothing is written back to NetBox at any point. A device whose
# config pull fails fails the host and writes no archive file. A redaction
# that leaves a secret fails the host and writes no file.
#
# Git steps sit inside this device play, run once, so a --limit never skips
# them. bootstrap_netbox.yml is never called from here.

- name: Archive the running configuration of every backed-up device
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Require device credentials in the environment
      ansible.builtin.fail:
        msg: >-
          BACKUP_USER and/or BACKUP_PASSWORD are not set. Export both before
          running the playbook; device credentials come from the environment
          only and are never written to disk or logs.
      when: >-
        (lookup('ansible.builtin.env', 'BACKUP_USER') | default('', true) | trim) == ''
        or (lookup('ansible.builtin.env', 'BACKUP_PASSWORD') | default('', true) | trim) == ''
      no_log: true

    # The lookup hits NetBox over the network, so run it on exactly one
    # host. set_fact under run_once does not copy the fact to the other
    # hosts, so a follow-up task on all hosts takes it from the first
    # play host's hostvars.
    - name: Read the platform metadata from NetBox (once)
      ansible.builtin.set_fact:
        config_backup_platform_meta: "{{ lookup('config_backup_platforms') }}"
      run_once: true

    - name: Share the platform metadata with every host
      ansible.builtin.set_fact:
        config_backup_platform_meta: "{{ hostvars[ansible_play_hosts_all | first].config_backup_platform_meta }}"
      when: config_backup_platform_meta is not defined

    - name: Derive this device's network OS and platform user
      ansible.builtin.set_fact:
        config_backup_device_os: >-
          {{ config_backup_platform_meta.get(nb_platform_slug | default('', true), {}).get('ansible_network_os', '') }}
        config_backup_platform_user: >-
          {{ config_backup_platform_meta.get(nb_platform_slug | default('', true), {}).get('ansible_user', '') }}
        # ansible_network_os lands in this same set_fact on purpose: the
        # device connection resolves to network_cli as soon as
        # config_backup_device_os exists, and a network_cli connection
        # refuses to open before ansible_network_os is visible.
        ansible_network_os: >-
          {{ config_backup_platform_meta.get(nb_platform_slug | default('', true), {}).get('ansible_network_os', '') }}

    - name: Choose the gate outcome for this device
      ansible.builtin.set_fact:
        config_backup_gate: >-
          {{ 'no_member'
             if not (ansible_host | default('', true) | length)
             else ('no_task'
                   if (ansible_network_os | default('', true)) not in config_backup_os_values
                   else ('bad_connection'
                         if (ansible_connection | default('', true)) not in config_backup_connection_values
                         else 'run')) }}

    - name: Fail the device when its connector is not allowed
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: ansible_connection
          '{{ ansible_connection | default('', true) }}' is not one of
          network_cli, httpapi, netconf or local. The device is failed.
      when: config_backup_gate == 'bad_connection'

    # VeloCloud is a portal platform: there is no device session to open.
    # When any host in the play belongs to the velocloud platform, the
    # orchestrator is dumped exactly once, with --no-archive so the JSON
    # lands directly in the archive working tree under vco-backup/ and git
    # sees the diff instead of a tarball. The VeloCloud JSON is not
    # line-redacted yet.
    # The when looks at every host in the play, not this host, because
    # run_once evaluates it on a single host only.
    - name: Dump the VeloCloud orchestrator into the archive (once)
      ansible.builtin.command:
        cmd: >-
          {{ playbook_dir }}/scripts/vco_backup.py --no-archive
          --output {{ config_backup_workdir }}/vco-backup
      environment:
        VCO_USERNAME: "{{ lookup('ansible.builtin.env', 'VCO_USERNAME') }}"
        VCO_PASSWORD: "{{ lookup('ansible.builtin.env', 'VCO_PASSWORD') }}"
        VCO_URL: "{{ lookup('ansible.builtin.env', 'VCO_URL') }}"
      when: >-
        ansible_play_hosts_all
        | map('extract', hostvars, 'ansible_network_os')
        | select('defined') | select('equalto', 'velocloud')
        | list | length > 0
      register: config_backup_vco_dump
      run_once: true
      delegate_to: localhost
      no_log: true

    - name: End the play for devices outside this run
      ansible.builtin.meta: end_host
      when: config_backup_gate in ['no_member', 'no_task']

  tasks:
    - name: Run the task file for this device's network OS
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/{{ config_backup_task_files[ansible_network_os] }}"

    - name: Ensure the archive working tree exists
      ansible.builtin.file:
        path: "{{ config_backup_workdir }}"
        state: directory
        mode: '0750'
      run_once: true
      delegate_to: localhost

    - name: List the VeloCloud portal files in the archive (once)
      ansible.builtin.find:
        paths: "{{ config_backup_workdir }}/vco-backup"
        recurse: true
        file_type: file
      run_once: true
      delegate_to: localhost
      failed_when: false
      register: config_backup_vco_find

    - name: Compute the VeloCloud file list (once)
      ansible.builtin.set_fact:
        # A real list of paths relative to config_backup_workdir, or an
        # empty list when the dump did not run.
        config_backup_vco_files: >-
          {{ (config_backup_vco_find.files | default([])
              | map(attribute='path')
              | map('relpath', config_backup_workdir)
              | list)
             if not (config_backup_vco_find.skipped | default(false))
             else [] }}
      run_once: true

    - name: List the archive files this run wrote
      ansible.builtin.set_fact:
        # A real list, on purpose: the git step below iterates these and
        # quotes each one. A '[ ... ]'-style rendered string would make
        # that loop walk the string character by character. The VeloCloud
        # JSON files are staged next to the per-device files, and the
        # vco-backup directory itself is passed so git_sync.sh stages
        # removals inside it with 'git add -A'.
        config_backup_files: >-
          {{ (ansible_play_hosts_all
              | map('extract', hostvars, 'config_backup_written_path')
              | select('defined') | select('string') | list)
             + (ansible_play_hosts_all
                | map('extract', hostvars, 'config_backup_vco_files')
                | select('defined') | flatten | list)
             + (['vco-backup']
                if (ansible_play_hosts_all
                    | map('extract', hostvars, 'config_backup_vco_files')
                    | select('defined') | flatten | list | length) > 0
                else []) }}

    - name: Stage, commit and push the written files, or keep them local
      ansible.builtin.command:
        cmd: >-
          {{ playbook_dir }}/scripts/git_sync.sh --{% for archive_file in config_backup_files %} {{ archive_file | quote }}{% endfor %}
        chdir: "{{ config_backup_workdir }}"
      environment:
        BACKUP_GIT_URL: "{{ config_backup_git_url }}"
        BACKUP_GIT_TOKEN: "{{ lookup('ansible.builtin.env', 'BACKUP_GIT_TOKEN') }}"
        BACKUP_WORKDIR: "{{ config_backup_workdir }}"
      register: config_backup_git_sync
      changed_when: "'committed' in (config_backup_git_sync.stdout | default(''))"
      run_once: true
      delegate_to: localhost
