---
# Ensure the six NetBox custom fields this playbook uses exist.
#
# Creates a missing field or updates an existing one; never deletes
# anything. Select fields keep their choices in a NetBox choice set that
# this play also ensures (NetBox 4.x has no inline field choices).
# Fields on dcim.platform (ansible_network_os, ansible_user) and
# on dcim.device (observed_version, observed_at, validation_state,
# desired_version) follow the spec exactly.
#
# All six are grouped under the custom-field group_name Backup, and the
# play sets that group on both create and update.
#
# Run once from the runner:
#   NETBOX_API=... NETBOX_TOKEN=... ansible-playbook bootstrap_netbox.yml
#
# The nightly backup never runs this play. In check mode the play only
# reports the six fields it would ensure.

- name: Ensure the NetBox custom fields for config backup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    config_backup_fields:
      - name: ansible_network_os
        object_types: [dcim.platform]
        type: select
        choices:
          - cisco.ios.ios
          - cisco.nxos.nxos
          - junipernetworks.junos.junos
          - paloaltonetworks.panos.panos
          - f5.bigip
          - cisco.meraki
          - velocloud
      - name: ansible_user
        object_types: [dcim.platform]
        type: text
      - name: observed_version
        object_types: [dcim.device]
        type: text
      - name: observed_at
        object_types: [dcim.device]
        type: datetime
      - name: validation_state
        object_types: [dcim.device]
        type: select
        choices:
          - current
          - unreachable
          - unparsed
          - no_task
      - name: desired_version
        object_types: [dcim.device]
        type: text

    # NetBox 4.x keeps select-field choices in a choice set; one namespaced
    # set per select field is ensured before the field itself.
    config_backup_choice_set_prefix: config_backup_

  tasks:
    - name: Report the custom fields this play ensures
      ansible.builtin.debug:
        msg: "custom_field {{ item.name }} object={{ item.object_types | join(',') }} type={{ item.type }}"
      loop: "{{ config_backup_fields }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require NetBox API access in the environment
      ansible.builtin.fail:
        msg: >-
          NETBOX_API and/or NETBOX_TOKEN are not set. Export both before
          running this play; the values are read from the environment only
          and are never echoed here.
      when: >
        not ansible_check_mode and
        ((lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim) == '' or
         (lookup('ansible.builtin.env', 'NETBOX_TOKEN') | default('', true) | trim) == '')

    - name: Read the existing choice sets for the select fields
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim | regex_replace('/+$', '') }}/api/extras/custom-field-choice-sets/?name={{ config_backup_choice_set_prefix }}{{ item.name }}"
        method: GET
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
          Accept: application/json
        status_code: 200
        validate_certs: true
      loop: "{{ config_backup_fields | selectattr('choices', 'defined') | list }}"
      loop_control:
        label: "{{ config_backup_choice_set_prefix }}{{ item.name }}"
      register: config_backup_choice_set_read
      no_log: true
      failed_when: false

    - name: Refuse to continue when a NetBox choice set could not be read
      ansible.builtin.fail:
        msg: "{{ config_backup_choice_set_prefix }}{{ item.item.name }}: NetBox choice set read failed (HTTP {{ item | config_backup_http_status }})."
      loop: "{{ config_backup_choice_set_read.results | default([], true) }}"
      when: not ansible_check_mode and (item | config_backup_http_status) != 200

    - name: Create a missing choice set on NetBox
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim | regex_replace('/+$', '') }}/api/extras/custom-field-choice-sets/"
        method: POST
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
          Accept: application/json
          Content-Type: application/json
        body_format: json
        body: >-
          {{ {'name': config_backup_choice_set_prefix ~ item.item.name,
              'extra_choices': (item.item.choices | zip(item.item.choices) | list),
              'order_alphabetically': false} }}
        status_code: 201
        validate_certs: true
      loop: "{{ config_backup_choice_set_read.results }}"
      loop_control:
        label: "{{ config_backup_choice_set_prefix }}{{ item.item.name }}"
      when: not ansible_check_mode and (item | config_backup_http_status) == 200 and item.json.count == 0
      register: config_backup_choice_set_created
      no_log: true

    - name: Update an existing choice set when its choices drifted
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim | regex_replace('/+$', '') }}/api/extras/custom-field-choice-sets/{{ item.json.results[0].id }}/"
        method: PATCH
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
          Accept: application/json
          Content-Type: application/json
        body_format: json
        body: >-
          {{ {'extra_choices': (item.item.choices | zip(item.item.choices) | list),
              'order_alphabetically': false} }}
        status_code: 200
        validate_certs: true
      loop: "{{ config_backup_choice_set_read.results }}"
      loop_control:
        label: "{{ config_backup_choice_set_prefix }}{{ item.item.name }}"
      when: >-
        not ansible_check_mode and
        (item | config_backup_http_status) == 200 and
        item.json.count > 0 and
        (item.json.results[0].extra_choices | to_json) != ((item.item.choices | zip(item.item.choices) | list) | to_json)
      register: config_backup_choice_set_updated
      no_log: true

    - name: Read the existing custom fields from NetBox
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim | regex_replace('/+$', '') }}/api/extras/custom-fields/?name={{ item.name }}"
        method: GET
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
          Accept: application/json
        status_code: 200
        validate_certs: true
      loop: "{{ config_backup_fields }}"
      loop_control:
        label: "{{ item.name }}"
      register: config_backup_field_read
      no_log: true
      failed_when: false

    - name: Refuse to continue when NetBox could not be read
      ansible.builtin.fail:
        msg: "{{ item.item.name }}: NetBox read failed (HTTP {{ item | config_backup_http_status }})."
      loop: "{{ config_backup_field_read.results | default([], true) }}"
      when: not ansible_check_mode and (item | config_backup_http_status) != 200

    - name: Create a missing custom field on NetBox
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim | regex_replace('/+$', '') }}/api/extras/custom-fields/"
        method: POST
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
          Accept: application/json
          Content-Type: application/json
        body_format: json
        body: >-
          {{ {'name': item.item.name,
              'label': item.item.name,
              'type': item.item.type,
              'object_types': item.item.object_types,
              'required': false,
              'group_name': 'Backup'}
             | combine({} if not (item.item.choices | default([], true)) else {'choice_set': ((config_backup_choice_set_read.results | selectattr('item', 'equalto', item.item) | first).json.results[0].id if (config_backup_choice_set_read.results | selectattr('item', 'equalto', item.item) | first).json.count > 0 else (config_backup_choice_set_created.results | selectattr('item', 'equalto', item.item) | first).json.id)}) }}
        status_code: 201
        validate_certs: true
      loop: "{{ config_backup_field_read.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not ansible_check_mode and (item | config_backup_http_status) == 200 and item.json.count == 0
      no_log: true

    - name: Update an existing custom field on NetBox
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | default('', true) | trim | regex_replace('/+$', '') }}/api/extras/custom-fields/{{ item.json.results[0].id }}/"
        method: PATCH
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
          Accept: application/json
          Content-Type: application/json
        body_format: json
        body: >-
          {{ {'name': item.item.name,
              'label': item.item.name,
              'type': item.item.type,
              'object_types': item.item.object_types,
              'required': false,
              'group_name': 'Backup'}
             | combine({} if not (item.item.choices | default([], true)) else {'choice_set': ((config_backup_choice_set_read.results | selectattr('item', 'equalto', item.item) | first).json.results[0].id if (config_backup_choice_set_read.results | selectattr('item', 'equalto', item.item) | first).json.count > 0 else (config_backup_choice_set_created.results | selectattr('item', 'equalto', item.item) | first).json.id)}) }}
        status_code: 200
        validate_certs: true
      loop: "{{ config_backup_field_read.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not ansible_check_mode and (item | config_backup_http_status) == 200 and item.json.count > 0
      no_log: true